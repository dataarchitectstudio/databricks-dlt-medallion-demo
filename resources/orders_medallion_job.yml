resources:
  jobs:
    orders_medallion_demo_every_5min:
      name: "orders_medallion_demo_every_5min (deployed ${var.deploy_date})"
      schedule:
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: run_orders_medallion_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_medallion_demo.id}
            full_refresh: false
