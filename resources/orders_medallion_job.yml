resources:
  jobs:
    orders_medallion_demo_every_day:
      name: "orders_medallion_demo_every_day (deployed ${var.deploy_date})"
      schedule:
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: run_orders_medallion_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_medallion_demo.id}
            full_refresh: false

        - task_key: summarize_revenue
          depends_on:
            - task_key: run_orders_medallion_pipeline
          environment_key: default
          python_wheel_task:
            package_name: orders_medallion
            entry_point: main
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - ../dist/*.whl
